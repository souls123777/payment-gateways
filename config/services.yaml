# Wiring of the hexagonal layers.
# The Domain layer is plain PHP and is deliberately not registered as services.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Kernel.php'

    # Strategy: every PaymentGateway implementation gets the tag automatically.
    _instanceof:
        App\Application\Payment\Port\PaymentGateway:
            tags: ['app.payment_gateway']

    # Factory: receives all tagged gateways and picks the one that supports a method.
    App\Infrastructure\Payment\TaggedPaymentGatewayFactory:
        arguments:
            $gateways: !tagged_iterator app.payment_gateway

    # Port -> adapter binding, explicit on purpose.
    App\Application\Payment\Port\PaymentGatewayFactory: '@App\Infrastructure\Payment\TaggedPaymentGatewayFactory'
